# Локальная БД для прототипа P0. Только для разработки: пароль демонстрационный.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: talisman
      POSTGRES_PASSWORD: talisman
      POSTGRES_DB: talisman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
